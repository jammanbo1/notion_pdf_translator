name: Notion Figure Auto Pipeline

on:
  schedule:
    # 3시간마다 내용 요약본과 30분 시차를 두고 실행 (UTC 기준)
    - cron: '30 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-figure-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-nanum fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install notion-client google-generativeai playwright requests python-dotenv
          playwright install --with-deps chromium

      - name: Execute Figure Extractor Script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python notion_to_gemini_figure.py
