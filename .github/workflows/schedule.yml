name: Notion to Gemini PDF Sync

on:
  workflow_dispatch: # GitHub Actions 탭에서 버튼을 눌러 수동 실행

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release 파일 업로드를 위해 쓰기 권한 부여

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install notion-client google-generativeai requests python-dotenv playwright
          playwright install --with-deps chromium

      - name: Notion to Gemini 스크립트 실행
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python notion_to_gemini.py
