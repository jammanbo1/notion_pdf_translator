name: Notion PDF Auto Processor

on:
  schedule:
    # 한국 시간 기준 08:00 ~ 23:59 (매 15분마다 실행)
    - cron: '*/15 23,0-14 * * *'
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 및 Playwright 설치
        run: |
          pip install notion-client python-dotenv requests google-generativeai playwright google-api-python-client google-auth
          python -m playwright install --with-deps chromium

      - name: 자동화 스크립트 실행
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python notion_to_gemini.py
